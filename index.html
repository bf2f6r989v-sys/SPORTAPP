<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>IronTrack — Full Body Home Gym</title>

  <!-- PWA & iOS Standalone Config -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IronTrack" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-dark: #059669;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --danger: #ef4444;
      --purple: #a78bfa;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + var(--safe-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #0f172a;
      font-size: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand small {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px calc(104px + var(--safe-bottom));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    /* Buttons */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #052e16;
      padding: 11px 16px;
    }

    .btn-primary:hover {
      background: #34d399;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 13px;
    }

    .btn-amber {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 9px 13px;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 8px 12px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Badges */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .eq-rack { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.35); }
    .eq-tractions { background: rgba(167, 139, 250, 0.16); color: #c4b5fd; border-color: rgba(167, 139, 250, 0.35); }
    .eq-poulie-h { background: rgba(244, 114, 182, 0.15); color: #f9a8d4; border-color: rgba(244, 114, 182, 0.35); }
    .eq-poulie-b { background: rgba(251, 146, 60, 0.15); color: #fdba74; border-color: rgba(251, 146, 60, 0.35); }
    .eq-banc { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.35); }
    .eq-barre { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.35); }
    .eq-ez { background: rgba(250, 204, 21, 0.15); color: #fde047; border-color: rgba(250, 204, 21, 0.35); }
    .eq-halteres { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; border-color: rgba(99, 102, 241, 0.38); }
    .badge-deload { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.45); }

    /* Deload Progress */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-fill.warn {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    .alert-box {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-top: 8px;
    }

    /* Template exercise preview */
    .tpl-ex-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tpl-ex-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 8px;
    }

    /* Active Workout */
    .set-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .set-table th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
      padding: 4px 2px 6px;
    }

    .set-table td {
      padding: 5px 3px;
      text-align: center;
      vertical-align: middle;
    }

    .set-row.done-row {
      background: rgba(16, 185, 129, 0.08);
    }

    .set-num {
      font-weight: 700;
      color: var(--muted);
      font-size: 13px;
      width: 26px;
    }

    .prev-perf {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="number"], input[type="text"], textarea, select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 8px;
      font-size: 15px;
      font-family: inherit;
      width: 100%;
      outline: none;
    }

    input[type="number"]:focus, input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .set-input {
      text-align: center;
      font-weight: 700;
      max-width: 78px;
      padding: 10px 4px !important;
    }

    .check-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 18px;
      display: inline-grid;
      place-items: center;
    }

    .check-btn.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
    }

    .note-input {
      margin-top: 8px;
      font-size: 13px !important;
      padding: 8px 10px !important;
    }

    /* Switch */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .toggle-pill {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .toggle-pill.active {
      background: rgba(245, 158, 11, 0.22);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.6);
    }

    /* Floating Rest Timer */
    #rest-timer {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(74px + var(--safe-bottom));
      max-width: 696px;
      margin: 0 auto;
      background: #0b1220;
      border: 1px solid var(--accent);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      padding: 12px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 60;
    }

    #rest-timer.visible {
      display: flex;
    }

    .timer-time {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1;
    }

    .timer-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 8px calc(8px + var(--safe-bottom));
      z-index: 50;
    }

    .nav-btn {
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      font-size: 11px;
      border-radius: 10px;
      position: relative;
    }

    .nav-btn .nav-ico {
      font-size: 20px;
      line-height: 1;
    }

    .nav-btn.active {
      color: var(--accent);
    }

    .active-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      position: absolute;
      top: 4px;
      right: calc(50% - 18px);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      z-index: 80;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 16px calc(24px + var(--safe-bottom));
    }

    .eq-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .eq-chip {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0f172a;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .eq-chip.selected {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border-color: var(--accent);
    }

    .hist-detail {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: none;
    }

    .hist-detail.open {
      display: block;
    }

    .hist-ex-block {
      margin-bottom: 10px;
      background: rgba(15, 23, 42, 0.5);
      padding: 8px 10px;
      border-radius: 9px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .stat-box {
      background: rgba(15, 23, 42, 0.65);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .stat-box strong {
      display: block;
      font-size: 16px;
      color: var(--text);
    }

    .stat-box span {
      font-size: 11px;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      top: calc(64px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #052e16;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 100;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">IT</div>
      <div>
        <h1>IronTrack</h1>
        <small>Full Body Home Gym</small>
      </div>
    </div>
    <div id="header-right"></div>
  </header>

  <main id="app"></main>

  <!-- Floating Rest Timer -->
  <div id="rest-timer">
    <div>
      <div class="timer-time" id="timer-display">02:00</div>
      <div class="timer-label" id="timer-ex-label">Repos en cours</div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary btn-sm" onclick="adjustTimer(-15)">-15s</button>
      <button class="btn-secondary btn-sm" onclick="adjustTimer(15)">+15s</button>
      <button class="btn-primary btn-sm" onclick="stopTimer()">Passer</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-templates" onclick="switchTab('templates')">
      <span class="nav-ico">🏋️</span>
      <span>Séances</span>
    </button>
    <button class="nav-btn" id="nav-active" onclick="switchTab('active')">
      <span class="nav-ico">⚡</span>
      <span>En cours</span>
      <span class="active-dot" id="active-dot" style="display:none;"></span>
    </button>
    <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
      <span class="nav-ico">📊</span>
      <span>Historique</span>
    </button>
  </nav>

  <!-- Template Editor Modal -->
  <div class="modal-backdrop" id="tpl-modal">
    <div class="modal" id="tpl-modal-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'irontrack_homegym_v1';

    const EQUIPMENT_LIST = [
      { id: 'Rack', label: 'Rack', cls: 'eq-rack' },
      { id: 'Tractions', label: 'Barre tractions', cls: 'eq-tractions' },
      { id: 'Poulie haute', label: 'Poulie haute', cls: 'eq-poulie-h' },
      { id: 'Poulie basse', label: 'Poulie basse', cls: 'eq-poulie-b' },
      { id: 'Banc', label: 'Banc inclinable', cls: 'eq-banc' },
      { id: 'Barre droite', label: 'Barre droite', cls: 'eq-barre' },
      { id: 'Barre EZ', label: 'Barre EZ', cls: 'eq-ez' },
      { id: 'Haltères', label: 'Haltères', cls: 'eq-halteres' }
    ];

    const DEFAULT_TEMPLATES = [
      {
        id: 'fb-a',
        name: 'Full Body A',
        subtitle: 'Force & Push/Squat dominant',
        exercises: [
          { name: 'Squat barre', targetSets: 4, targetReps: '6', restSec: 180, equipment: ['Rack', 'Barre droite'] },
          { name: 'Développé couché', targetSets: 4, targetReps: '6', restSec: 180, equipment: ['Rack', 'Banc', 'Barre droite'] },
          { name: 'Tractions pronation', targetSets: 4, targetReps: '6-8', restSec: 150, equipment: ['Tractions'] },
          { name: 'Développé militaire haltères', targetSets: 3, targetReps: '8-10', restSec: 120, equipment: ['Banc', 'Haltères'] },
          { name: 'Curl barre EZ', targetSets: 3, targetReps: '8-10', restSec: 90, equipment: ['Barre EZ'] },
          { name: 'Extension triceps poulie haute', targetSets: 3, targetReps: '10-12', restSec: 90, equipment: ['Poulie haute'] }
        ]
      },
      {
        id: 'fb-b',
        name: 'Full Body B',
        subtitle: 'Chaîne postérieure & Tirage horizontal',
        exercises: [
          { name: 'Soulevé de terre roumain', targetSets: 4, targetReps: '6-8', restSec: 180, equipment: ['Barre droite'] },
          { name: 'Développé incliné haltères', targetSets: 4, targetReps: '6-8', restSec: 150, equipment: ['Banc', 'Haltères'] },
          { name: 'Tirage horizontal poulie basse', targetSets: 4, targetReps: '8-10', restSec: 120, equipment: ['Poulie basse'] },
          { name: 'Fentes bulgares haltères', targetSets: 3, targetReps: '8-10', restSec: 120, equipment: ['Banc', 'Haltères'] },
          { name: 'Élévations latérales', targetSets: 3, targetReps: '12-15', restSec: 75, equipment: ['Haltères'] },
          { name: 'Face pull poulie haute', targetSets: 3, targetReps: '12-15', restSec: 75, equipment: ['Poulie haute'] }
        ]
      },
      {
        id: 'fb-c',
        name: 'Full Body C',
        subtitle: 'Hypertrophie complète & Isolation',
        exercises: [
          { name: 'Squat avant ou Goblet lourd', targetSets: 4, targetReps: '6-8', restSec: 180, equipment: ['Rack', 'Barre droite'] },
          { name: 'Rowing barre', targetSets: 4, targetReps: '6-8', restSec: 150, equipment: ['Barre droite'] },
          { name: 'Écartés haltères inclinés', targetSets: 3, targetReps: '10-12', restSec: 90, equipment: ['Banc', 'Haltères'] },
          { name: 'Tirage vertical poulie haute', targetSets: 3, targetReps: '8-10', restSec: 120, equipment: ['Poulie haute'] },
          { name: 'Barre au front EZ', targetSets: 3, targetReps: '8-10', restSec: 90, equipment: ['Banc', 'Barre EZ'] },
          { name: 'Curl marteau haltères', targetSets: 3, targetReps: '10-12', restSec: 90, equipment: ['Haltères'] }
        ]
      }
    ];

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            templates: parsed.templates || DEFAULT_TEMPLATES,
            history: parsed.history || [],
            activeWorkout: parsed.activeWorkout || null,
            deloadCycleWeeks: parsed.deloadCycleWeeks || 4,
            cycleStartDate: parsed.cycleStartDate || null
          };
        }
      } catch (e) {}
      return {
        templates: JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),
        history: [],
        activeWorkout: null,
        deloadCycleWeeks: 4,
        cycleStartDate: null
      };
    }

    let state = loadState();
    let currentTab = state.activeWorkout ? 'active' : 'templates';
    let timerInterval = null;
    let timerEndTime = null;
    let timerLabel = '';
    let editingTemplate = null;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateActiveDot();
    }

    function updateActiveDot() {
      const dot = document.getElementById('active-dot');
      if (dot) dot.style.display = state.activeWorkout ? 'block' : 'none';
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function eqBadgeHtml(eqList) {
      if (!eqList || !eqList.length) return '';
      return '<div class="badges">' + eqList.map(id => {
        const found = EQUIPMENT_LIST.find(e => e.id === id);
        const cls = found ? found.cls : 'eq-banc';
        const label = found ? found.label : id;
        return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
      }).join('') + '</div>';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function calcEpley1RM(weight, reps) {
      const w = parseFloat(weight);
      const r = parseInt(reps, 10);
      if (!w || !r || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    }

    function calcWorkoutTonnage(workout) {
      let total = 0;
      (workout.exercises || []).forEach(ex => {
        (ex.sets || []).forEach(s => {
          if (s.done) {
            const w = parseFloat(s.weight) || 0;
            const r = parseInt(s.reps, 10) || 0;
            total += w * r;
          }
        });
      });
      return Math.round(total);
    }

    function getLastNonDeloadExercise(exName) {
      for (const h of state.history) {
        if (h.isDeload) continue;
        const found = (h.exercises || []).find(e => e.name.toLowerCase() === exName.toLowerCase());
        if (found && found.sets && found.sets.some(s => s.done)) {
          return found;
        }
      }
      return null;
    }

    function getCycleStats() {
      const targetSessions = state.deloadCycleWeeks * 3;
      let count = 0;
      for (const h of state.history) {
        if (state.cycleStartDate && h.date < state.cycleStartDate) break;
        if (h.isDeload) break;
        count++;
      }
      const pct = Math.min(100, Math.round((count / targetSessions) * 100));
      const due = count >= targetSessions;
      return { count, targetSessions, pct, due };
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('nav-' + tab);
      if (activeBtn) activeBtn.classList.add('active');
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // --- WORKOUT LIFECYCLE ---
    function startWorkout(templateId, forceDeload = false) {
      if (state.activeWorkout) {
        if (!confirm('Une séance est déjà en cours. La remplacer ?')) return;
      }
      const tpl = state.templates.find(t => t.id === templateId);
      if (!tpl) return;

      const exercises = tpl.exercises.map(ex => {
        const lastEx = getLastNonDeloadExercise(ex.name);
        const sets = [];
        for (let i = 0; i < (ex.targetSets || 3); i++) {
          const prevSet = lastEx && lastEx.sets[i] ? lastEx.sets[i] : (lastEx && lastEx.sets[lastEx.sets.length - 1] ? lastEx.sets[lastEx.sets.length - 1] : null);
          let weight = prevSet && prevSet.weight !== '' ? parseFloat(prevSet.weight) : '';
          if (forceDeload && weight !== '' && !isNaN(weight)) {
            weight = Math.round((weight * 0.8) * 2) / 2;
          }
          const reps = prevSet && prevSet.reps !== '' ? prevSet.reps : (parseInt(ex.targetReps, 10) || '');
          sets.push({
            weight: weight,
            reps: reps,
            prevText: prevSet && prevSet.weight !== '' ? `${prevSet.weight}kg × ${prevSet.reps}` : '—',
            done: false
          });
        }
        return {
          name: ex.name,
          targetReps: ex.targetReps || '8-10',
          restSec: ex.restSec || 120,
          equipment: ex.equipment || [],
          note: lastEx && lastEx.note ? lastEx.note : '',
          sets
        };
      });

      state.activeWorkout = {
        id: new Date().toISOString(),
        templateId: tpl.id,
        name: tpl.name,
        startedAt: Date.now(),
        isDeload: forceDeload,
        exercises
      };
      saveState();
      switchTab('active');
      showToast(forceDeload ? 'Séance Deload démarrée (-20%)' : 'Séance démarrée !');
    }

    function toggleActiveDeload() {
      if (!state.activeWorkout) return;
      state.activeWorkout.isDeload = !state.activeWorkout.isDeload;
      saveState();
      render();
    }

    function applyDeloadDiscount() {
      if (!state.activeWorkout) return;
      state.activeWorkout.isDeload = true;
      state.activeWorkout.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          const w = parseFloat(s.weight);
          if (!isNaN(w) && w > 0) {
            s.weight = Math.round((w * 0.8) * 2) / 2;
          }
        });
      });
      saveState();
      render();
      showToast('Charges réduites de 20% (arrondi 0,5 kg)');
    }

    function updateSetField(exIdx, setIdx, field, value) {
      if (!state.activeWorkout) return;
      state.activeWorkout.exercises[exIdx].sets[setIdx][field] = value;
      saveState();
    }

    function toggleSetDone(exIdx, setIdx) {
      if (!state.activeWorkout) return;
      const ex = state.activeWorkout.exercises[exIdx];
      const set = ex.sets[setIdx];
      set.done = !set.done;
      saveState();
      render();
      if (set.done) {
        startTimer(ex.restSec || 120, ex.name);
      }
    }

    function addSetToEx(exIdx) {
      const ex = state.activeWorkout.exercises[exIdx];
      const last = ex.sets[ex.sets.length - 1] || { weight: '', reps: '', prevText: '—' };
      ex.sets.push({ weight: last.weight, reps: last.reps, prevText: '—', done: false });
      saveState();
      render();
    }

    function removeSetFromEx(exIdx, setIdx) {
      const ex = state.activeWorkout.exercises[exIdx];
      if (ex.sets.length <= 1) return;
      ex.sets.splice(setIdx, 1);
      saveState();
      render();
    }

    function updateExNote(exIdx, val) {
      state.activeWorkout.exercises[exIdx].note = val;
      saveState();
    }

    function addFreeExercise() {
      const name = prompt("Nom de l'exercice à ajouter :");
      if (!name || !name.trim()) return;
      state.activeWorkout.exercises.push({
        name: name.trim(),
        targetReps: '8-12',
        restSec: 90,
        equipment: [],
        note: '',
        sets: [
          { weight: '', reps: '', prevText: '—', done: false },
          { weight: '', reps: '', prevText: '—', done: false },
          { weight: '', reps: '', prevText: '—', done: false }
        ]
      });
      saveState();
      render();
    }

    function finishWorkout() {
      if (!state.activeWorkout) return;
      const doneSets = state.activeWorkout.exercises.reduce((acc, ex) => acc + ex.sets.filter(s => s.done).length, 0);
      if (doneSets === 0) {
        if (!confirm("Aucune série n'est cochée. Terminer quand même ?")) return;
      }
      const durationMin = Math.max(1, Math.round((Date.now() - state.activeWorkout.startedAt) / 60000));
      const record = {
        id: state.activeWorkout.id,
        templateId: state.activeWorkout.templateId,
        name: state.activeWorkout.name,
        date: new Date().toISOString().slice(0, 10),
        durationMin,
        isDeload: state.activeWorkout.isDeload,
        exercises: state.activeWorkout.exercises
      };
      state.history.unshift(record);
      state.activeWorkout = null;
      stopTimer();
      saveState();
      switchTab('history');
      showToast('Séance enregistrée !');
    }

    function cancelWorkout() {
      if (!confirm('Annuler la séance en cours ? Les données non sauvegardées seront perdues.')) return;
      state.activeWorkout = null;
      stopTimer();
      saveState();
      switchTab('templates');
    }

    // --- REST TIMER (Date.now() accurate) ---
    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        [0, 0.22].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 0.19);
        });
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    function startTimer(seconds, label) {
      timerEndTime = Date.now() + seconds * 1000;
      timerLabel = label || 'Repos';
      document.getElementById('timer-ex-label').textContent = 'Repos · ' + timerLabel;
      document.getElementById('rest-timer').classList.add('visible');
      updateTimerDisplay();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 250);
    }

    function adjustTimer(deltaSec) {
      if (!timerEndTime) return;
      timerEndTime = Math.max(Date.now() + 1000, timerEndTime + deltaSec * 1000);
      updateTimerDisplay();
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerEndTime = null;
      document.getElementById('rest-timer').classList.remove('visible');
    }

    function updateTimerDisplay() {
      if (!timerEndTime) return;
      const rem = Math.ceil((timerEndTime - Date.now()) / 1000);
      if (rem <= 0) {
        playBeep();
        stopTimer();
        showToast('Repos terminé — À toi !');
        return;
      }
      const m = String(Math.floor(rem / 60)).padStart(2, '0');
      const s = String(rem % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    // --- DELOAD CYCLE SETTINGS ---
    function setDeloadWeeks(w) {

      saveState();
      render();

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `irontrack-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Sauvegarde JSON téléchargée');
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data.templates && !data.history) throw new Error('Format invalide');
          state = {
            templates: data.templates || state.templates,
            history: data.history || [],
            activeWorkout: data.activeWorkout || null,
            deloadCycleWeeks: data.deloadCycleWeeks || 4,
            cycleStartDate: data.cycleStartDate || null
          };
          saveState();
          render();
          showToast('Données importées !');
        } catch (err) {
          alert('Fichier JSON invalide.');
        }
      };
      reader.readAsText(file);
    }

    function exportCSV() {
      const rows = [['Date', 'Seance', 'Deload', 'Exercice', 'Serie', 'Poids_kg', 'Reps', '1RM_Epley', 'Note']];
      state.history.forEach(h => {
        (h.exercises || []).forEach(ex => {
          (ex.sets || []).forEach((s, idx) => {
            if (!s.done) return;
            rows.push([
              h.date,
              `"${(h.name || '').replace(/"/g, '""')}"`,
              h.isDeload ? 'Oui' : 'Non',
              `"${(ex.name || '').replace(/"/g, '""')}"`,
              idx + 1,
              s.weight || 0,
              s.reps || 0,
              calcEpley1RM(s.weight, s.reps),
              `"${(ex.note || '').replace(/"/g, '""')}"`
            ]);
          });
        });
      });
      const csv = rows.map(r => r.join(';')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `irontrack-historique-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Export CSV téléchargé');
    }

          <div class="btn-row" style="margin-bottom:20px;">
            <button class="btn-secondary" style="flex:1;" onclick="addFreeExercise()">+ Exercice libre</button>
            <button class="btn-primary" style="flex:1;" onclick="finishWorkout()">Terminer & Enregistrer</button>
          </div>
        `;
      } else if (currentTab === 'history') {
        headerRight.innerHTML = '';
        const totalSessions = state.history.length;
        const totalTonnage = state.history.reduce((sum, h) => sum + calcWorkoutTonnage(h), 0);

        app.innerHTML = `
          <div class="card">
            <h2 class="card-title">Sauvegarde & Export</h2>
            <p class="muted" style="margin:4px 0 10px;">Tes données restent sur ton téléphone. Pense à exporter un JSON de temps en temps.</p>
            <div class="btn-row">
              <button class="btn-primary btn-sm" onclick="exportJSON()">Exporter JSON</button>
              <label class="btn-secondary btn-sm" style="cursor:pointer;display:inline-block;">
                Importer JSON
                <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)" />
              </label>
              <button class="btn-secondary btn-sm" onclick="exportCSV()">Exporter CSV (Excel)</button>
            </div>
            <div class="stat-grid">
              <div class="stat-box"><strong>${totalSessions}</strong><span>Séances</span></div>
              <div class="stat-box"><strong>${(totalTonnage / 1000).toFixed(1)} t</strong><span>Tonnage total</span></div>
              <div class="stat-box"><strong>${getCycleStats().count}/${getCycleStats().targetSessions}</strong><span>Cycle actuel</span></div>
            </div>
          </div>

          ${state.history.length === 0 ? `
            <div class="card" style="text-align:center;padding:24px;">
              <p class="muted">Aucune séance enregistrée pour le moment.</p>
            </div>
          ` : state.history.map((h, i) => {
            const tonnage = calcWorkoutTonnage(h);
            return `
              <div class="card">
                <div class="card-header" style="cursor:pointer;margin-bottom:0;" onclick="document.getElementById('hist-${i}').classList.toggle('open')">
                  <div>
                    <h3 class="card-title">${escapeHtml(h.name)} ${h.isDeload ? '<span class="badge badge-deload">DELOAD</span>' : ''}</h3>
                    <div class="muted">${h.date} · ${h.durationMin || 45} min · <strong>${tonnage.toLocaleString('fr-FR')} kg</strong></div>
                  </div>
                  <span class="muted">▼</span>
                </div>
                <div class="hist-detail" id="hist-${i}">
                  ${(h.exercises || []).map(ex => {
                    const doneSets = (ex.sets || []).filter(s => s.done);
                    if (!doneSets.length) return '';
                    const best1RM = Math.max(...doneSets.map(s => calcEpley1RM(s.weight, s.reps)));
                    return `
                      <div class="hist-ex-block">
                        <div style="display:flex;justify-content:space-between;gap:8px;">
                          <strong style="font-size:13px;">${escapeHtml(ex.name)}</strong>
                          ${best1RM > 0 ? `<span class="badge eq-barre">1RM est. ${best1RM} kg</span>` : ''}
                        </div>
                        <div class="muted" style="margin-top:4px;font-size:12px;">
                          ${doneSets.map(s => `${s.weight || 0}kg×${s.reps || 0}`).join(' · ')}
                        </div>
                        ${ex.note ? `<div style="font-size:12px;color:#cbd5e1;margin-top:4px;font-style:italic;">📝 ${escapeHtml(ex.note)}</div>` : ''}
                      </div>
                    `;
                  }).join('')}
                  <div style="text-align:right;margin-top:8px;">
                    <button class="btn-danger btn-sm" onclick="deleteHistoryItem('${h.id}')">Supprimer</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        `;
      }
    }

    render();

    // Register Service Worker for offline PWA support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
